version: "1.0"
project: 智能工厂网络 · 配置即代码与可达性验证
note: >
  50 条用例。kind 区分正向 / 负向 / 变异：
    正向 —— 验证设计意图成立
    负向 —— 验证约束被正确违反拦截（越界、缺路由、默认拒绝）
    变异 —— 故意把拓扑改坏，验证校验能力能检出（等价于变异测试）
  checks 列出该用例触发哪些校验能力，报告里的能力覆盖率由此计算。

cases:
  # ================= 配置生成与一致性（6） =================
  - id: TC-GEN-001
    title: 按拓扑生成全部设备配置且头部可追溯
    category: 配置生成
    module: 配置生成
    requirement: REQ-GEN-011
    checks: [CHK-GEN]
    method: 等价类
    kind: 正向
    priority: P0
    expected: 6 台设备各有一份配置；文件头含设备名、型号、管理地址、拓扑版本与生成时间，并标注禁止手工修改

  - id: TC-GEN-002
    title: VLAN 定义完整下发
    category: 配置生成
    module: 配置生成
    requirement: REQ-GEN-012
    checks: [CHK-CONFIG]
    method: 边界值
    kind: 正向
    priority: P0
    expected: 每台设备的 vlan batch 覆盖其拓扑中声明的全部 VLAN，无遗漏

  - id: TC-GEN-003
    title: 接口配置与拓扑逐条一致
    category: 配置生成
    module: 配置生成
    requirement: REQ-GEN-013
    checks: [CHK-CONFIG]
    method: 等价类
    kind: 正向
    priority: P0
    expected: Trunk 放行列表、Access 默认 VLAN、路由口地址掩码与拓扑完全一致

  - id: TC-GEN-004
    title: SVI 网关与 VRRP 配置一致
    category: 配置生成
    module: 配置生成
    requirement: REQ-GEN-014
    checks: [CHK-CONFIG]
    method: 等价类
    kind: 正向
    priority: P0
    expected: 每个 VLAN 的 SVI 地址掩码、VRRP 虚拟地址与优先级均与拓扑一致

  - id: TC-GEN-005
    title: ACL 与策略表逐条对应且顺序一致
    category: 配置生成
    module: 配置生成
    requirement: REQ-GEN-016
    checks: [CHK-CONFIG, CHK-POLICY-ORDER, CHK-DEADRULE]
    method: 等价类
    kind: 正向
    priority: P0
    expected: 四个域的 ACL 规则条数与内容顺序与规范化策略表逐条一致；死规则已剔除、兜底拒绝保留；策略表末条为 any->any 拒绝

  - id: TC-GEN-006
    title: 生成结果幂等
    category: 配置生成
    module: 配置生成
    requirement: REQ-GEN-017
    checks: [CHK-IDEMPOTENT]
    method: 错误推测
    kind: 正向
    priority: P1
    expected: 同一拓扑重复生成输出逐字节一致；不同时间戳仅头部一行不同（配置比对才有意义）

