# =============================================================================
#
sysname RT-EGRESS
#
# ---- NAT 地址转换规则（Easy IP / PAT）----
#
acl number 2000
 description NAT-EGRESS
 rule 5 permit source 10.10.20.0 0.0.0.255
 rule 10 permit source 10.10.30.0 0.0.0.255
#
# ---- 物理接口 ----
#
interface GigabitEthernet0/0/1
 description To Core-SW-1:GE0/0/21 / 内网主用出口
 undo portswitch
 ip address 10.10.88.2 255.255.255.252
#
interface GigabitEthernet0/0/2
 description To Core-SW-2:GE0/0/21 / 内网备用出口
 undo portswitch
 ip address 10.10.88.6 255.255.255.252
#
interface GigabitEthernet0/0/3
 description To Internet / 公网出口
 undo portswitch
 ip address 198.51.100.2 255.255.255.252
 nat outbound 2000
#
interface GigabitEthernet0/0/4
 description To ACC-SERVER:GE0/0/12 / 带外管理口
 undo portswitch
 ip address 10.10.40.200 255.255.255.0
#
# ---- 路由 ----
#
ip route-static 10.10.0.0 255.255.0.0 10.10.88.1 preference 10
ip route-static 10.10.0.0 255.255.0.0 10.10.88.5 preference 20
ip route-static 0.0.0.0 0.0.0.0 198.51.100.1 preference 10
#
# ---- 基础运维 ----
#
ntp-service unicast-server 10.10.30.31
#
info-center enable
info-center loghost 10.10.40.100
info-center source default channel 2 log level warning
#
stelnet server enable
#
aaa
 local-user netadmin password irreversible-cipher Netadmin@2026
 local-user netadmin privilege level 15
 local-user netadmin service-type ssh
 local-user netadmin service-type snmp
#
user-interface vty 0 4
 authentication-mode aaa
 protocol inbound ssh
#
snmp-agent
 snmp-agent sys-info version v2c
 snmp-agent community read cipher SnmpRead@2026
#
return
