[pytest]
testpaths = tests
python_files = test_*.py
python_classes =
python_functions = test_*

addopts =
    -v
    -ra
    --strict-markers
    --tb=short
    -p no:cacheprovider

markers =
    generation: 配置生成与一致性
    topology: 拓扑数据质量
    layer2: 二层与 VLAN
    layer3: 三层与路由
    security: 安全策略与 ACL
    nat: NAT 与出口
    matrix: 可达性矩阵与期望
    availability: 可用性与冗余
    fault: 故障检出能力
    docs: 文档与排查 SOP

log_cli = false
log_level = WARNING
